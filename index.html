<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Stan Korean 💜 — Words Every K-pop Stan Should Know</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    /* ── Variables ─────────────────────────────────────────── */
    :root {
      --bg-deep:       #0F0F0F;
      --bg-surface:    #1A1A1A;
      --bg-card:       #1C1C2E;
      --bg-card-hover: #20203A;

      --purple-1: #9747FF;
      --purple-2: #B794F6;
      --purple-3: #6B46C1;

      --text-primary:  #F0E6FF;
      --text-secondary:#B794F6;
      --text-muted:    #6B6B8A;
      --text-dim:      #3A3A58;

      --border-subtle: rgba(151, 71, 255, 0.14);
      --border-active: rgba(151, 71, 255, 0.5);

      --radius-sm: 8px;
      --radius-md: 14px;
      --radius-lg: 20px;
      --radius-xl: 28px;

      --shadow-card:  0 4px 24px rgba(0, 0, 0, 0.45);
      --shadow-glow:  0 0 20px rgba(151, 71, 255, 0.28);
      --shadow-glow2: 0 0 40px rgba(151, 71, 255, 0.45);

      --ease: cubic-bezier(0.4, 0, 0.2, 1);
    }

    /* ── Reset ─────────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', 'Noto Sans KR', sans-serif;
      background: var(--bg-deep);
      color: var(--text-primary);
      min-height: 100vh;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }

    ::-webkit-scrollbar { width: 5px; }
    ::-webkit-scrollbar-track { background: var(--bg-deep); }
    ::-webkit-scrollbar-thumb { background: var(--purple-3); border-radius: 3px; }

    /* ── Ambient background ────────────────────────────────── */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse 60% 40% at 20% 10%, rgba(151, 71, 255, 0.07) 0%, transparent 70%),
        radial-gradient(ellipse 50% 35% at 80% 80%, rgba(107, 70, 193, 0.06) 0%, transparent 70%);
      pointer-events: none;
      z-index: 0;
    }

    /* ── Hero ──────────────────────────────────────────────── */
    .hero {
      position: relative;
      text-align: center;
      padding: 64px 20px 52px;
      z-index: 1;
    }

    .hero::after {
      content: '';
      position: absolute;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 80%;
      max-width: 500px;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(151, 71, 255, 0.25), transparent);
    }

    .hero-logo-row {
      display: inline-flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 14px;
    }

    .logo-gem {
      width: 52px;
      height: 52px;
      background: linear-gradient(135deg, #9747FF 0%, #6B46C1 100%);
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 26px;
      box-shadow: 0 0 28px rgba(151, 71, 255, 0.65), 0 4px 12px rgba(0,0,0,0.4);
      flex-shrink: 0;
    }

    .hero h1 {
      font-size: clamp(34px, 9vw, 56px);
      font-weight: 700;
      letter-spacing: -1.5px;
      line-height: 1;
      background: linear-gradient(135deg, #D8AFFE 0%, #9747FF 55%, #7C3AED 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .hero-sub {
      font-size: clamp(13px, 3.2vw, 16px);
      color: var(--text-muted);
      margin-top: 12px;
      letter-spacing: 0.01em;
      font-weight: 400;
    }

    .hero-pills {
      display: flex;
      justify-content: center;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 20px;
    }

    .hero-pill {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      padding: 5px 13px;
      border-radius: 100px;
      background: rgba(151, 71, 255, 0.1);
      border: 1px solid rgba(151, 71, 255, 0.25);
      color: var(--purple-2);
    }

    /* ── Container ─────────────────────────────────────────── */
    .container {
      position: relative;
      z-index: 1;
      max-width: 820px;
      margin: 0 auto;
      padding: 32px 16px 0;
    }

    /* ── Search ─────────────────────────────────────────────── */
    .search-wrap {
      position: relative;
      margin-bottom: 24px;
    }

    .search-icon {
      position: absolute;
      left: 20px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 17px;
      pointer-events: none;
      transition: opacity 0.2s;
      opacity: 0.5;
    }

    .search-input {
      width: 100%;
      background: var(--bg-card);
      border: 1.5px solid var(--border-subtle);
      border-radius: var(--radius-xl);
      padding: 16px 48px 16px 54px;
      font-size: 15px;
      font-family: 'Inter', 'Noto Sans KR', sans-serif;
      color: var(--text-primary);
      outline: none;
      transition: border-color 0.25s var(--ease), box-shadow 0.25s var(--ease);
    }

    .search-input::placeholder { color: var(--text-muted); }

    .search-input:focus {
      border-color: var(--purple-1);
      box-shadow: 0 0 0 3px rgba(151, 71, 255, 0.14), var(--shadow-glow);
    }

    .search-clear {
      position: absolute;
      right: 14px;
      top: 50%;
      transform: translateY(-50%);
      background: rgba(255,255,255,0.07);
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      padding: 5px 9px;
      border-radius: 6px;
      font-size: 13px;
      display: none;
      transition: color 0.2s;
    }
    .search-clear:hover { color: var(--text-primary); }
    .search-clear.show { display: block; }

    /* ── Filters ────────────────────────────────────────────── */
    .filters {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 36px;
    }

    .filter-btn {
      padding: 9px 20px;
      border-radius: 100px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      border: 1.5px solid var(--border-subtle);
      background: transparent;
      color: var(--text-muted);
      font-family: 'Inter', sans-serif;
      transition: all 0.22s var(--ease);
      white-space: nowrap;
    }

    .filter-btn:hover {
      border-color: rgba(151, 71, 255, 0.45);
      color: var(--purple-2);
      box-shadow: 0 0 12px rgba(151, 71, 255, 0.18);
    }

    .filter-btn.active {
      background: linear-gradient(135deg, #9747FF, #6B46C1);
      border-color: transparent;
      color: #fff;
      box-shadow: 0 0 18px rgba(151, 71, 255, 0.42);
    }

    /* ── Section label ──────────────────────────────────────── */
    .section-label {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--text-dim);
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .section-label::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--border-subtle);
    }

    /* ── Stan of the Day ────────────────────────────────────── */
    #sotdSection { margin-bottom: 36px; }

    .sotd-card {
      background: linear-gradient(135deg,
        rgba(151, 71, 255, 0.11) 0%,
        rgba(107, 70, 193, 0.07) 100%);
      border: 1.5px solid rgba(151, 71, 255, 0.32);
      border-radius: var(--radius-lg);
      padding: 26px 24px;
      position: relative;
      overflow: hidden;
      animation: pulseGlow 5s ease-in-out infinite;
    }

    .sotd-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(183, 148, 246, 0.55), transparent);
    }

    .sotd-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(151, 71, 255, 0.18);
      border: 1px solid rgba(151, 71, 255, 0.38);
      border-radius: 100px;
      padding: 4px 13px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.07em;
      text-transform: uppercase;
      color: var(--purple-2);
      margin-bottom: 18px;
    }

    /* ── Trending ───────────────────────────────────────────── */
    #trendingSection { margin-bottom: 40px; }

    .trending-chips {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .trend-chip {
      padding: 7px 15px;
      border-radius: 100px;
      font-size: 14px;
      cursor: pointer;
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      color: var(--text-secondary);
      font-family: 'Noto Sans KR', 'Inter', sans-serif;
      transition: all 0.22s var(--ease);
      white-space: nowrap;
    }

    .trend-chip:hover {
      background: rgba(151, 71, 255, 0.14);
      border-color: var(--purple-1);
      color: var(--purple-2);
      box-shadow: 0 0 10px rgba(151, 71, 255, 0.2);
      transform: translateY(-2px);
    }

    .trend-chip small {
      opacity: 0.45;
      font-size: 12px;
      font-family: 'Inter', sans-serif;
      margin-left: 2px;
    }

    /* ── Results meta ───────────────────────────────────────── */
    .results-meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
    }

    .results-count {
      font-size: 13px;
      color: var(--text-muted);
    }

    .results-count em {
      font-style: normal;
      color: var(--purple-2);
      font-weight: 600;
    }

    /* ── Cards grid ─────────────────────────────────────────── */
    .cards-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 14px;
      padding-bottom: 32px;
    }

    @media (min-width: 540px) {
      .cards-grid { grid-template-columns: repeat(2, 1fr); }
    }

    /* ── Word card ──────────────────────────────────────────── */
    .word-card {
      background: var(--bg-card);
      border: 1.5px solid var(--border-subtle);
      border-radius: var(--radius-lg);
      padding: 22px 20px;
      cursor: default;
      transition: border-color 0.25s var(--ease), box-shadow 0.25s var(--ease),
                  transform 0.25s var(--ease), background 0.25s var(--ease);
      position: relative;
      overflow: hidden;
      animation: fadeUp 0.35s var(--ease) both;
    }

    .word-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 2px;
      background: linear-gradient(90deg, transparent, transparent);
      transition: background 0.3s;
    }

    .word-card:hover {
      border-color: rgba(151, 71, 255, 0.45);
      box-shadow: 0 0 28px rgba(151, 71, 255, 0.2), var(--shadow-card);
      transform: translateY(-3px);
      background: var(--bg-card-hover);
    }

    .word-card:hover::before {
      background: linear-gradient(90deg, transparent, rgba(183, 148, 246, 0.55), transparent);
    }

    /* Card internals */
    .card-head {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 10px;
    }

    .card-ko {
      font-family: 'Noto Sans KR', sans-serif;
      font-size: 30px;
      font-weight: 700;
      color: var(--purple-2);
      line-height: 1;
      letter-spacing: -0.5px;
    }

    .cat-badge {
      font-size: 11px;
      font-weight: 600;
      padding: 3px 11px;
      border-radius: 100px;
      letter-spacing: 0.04em;
      white-space: nowrap;
      flex-shrink: 0;
    }
    .cat-lyrics { background: rgba(139, 92, 246, 0.14); color: #C084FC; border: 1px solid rgba(139, 92, 246, 0.28); }
    .cat-fandom { background: rgba(239, 68, 68, 0.1);   color: #F87171; border: 1px solid rgba(239, 68, 68, 0.22); }
    .cat-vibes  { background: rgba(16, 185, 129, 0.1);  color: #34D399; border: 1px solid rgba(16, 185, 129, 0.22); }
    .cat-daily  { background: rgba(251, 191, 36, 0.1);  color: #FCD34D; border: 1px solid rgba(251, 191, 36, 0.22); }

    .card-roman {
      font-size: 13px;
      color: var(--text-muted);
      font-style: italic;
      margin-bottom: 5px;
    }

    .card-en {
      font-size: 17px;
      font-weight: 600;
      color: var(--text-primary);
      margin-bottom: 5px;
    }

    .card-pos {
      display: inline-block;
      font-size: 11px;
      color: var(--text-dim);
      background: rgba(255, 255, 255, 0.04);
      border-radius: 5px;
      padding: 2px 8px;
      font-style: italic;
      margin-bottom: 14px;
    }

    .card-divider {
      height: 1px;
      background: var(--border-subtle);
      margin: 12px 0;
    }

    .vibe-label {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--purple-1);
      margin-bottom: 5px;
    }

    .vibe-text {
      font-size: 13px;
      color: var(--text-muted);
      line-height: 1.55;
      font-style: italic;
    }

    .card-example {
      margin-top: 14px;
      background: rgba(151, 71, 255, 0.06);
      border-left: 2px solid rgba(151, 71, 255, 0.38);
      border-radius: 0 var(--radius-sm) var(--radius-sm) 0;
      padding: 10px 13px;
    }

    .ex-ko {
      font-family: 'Noto Sans KR', sans-serif;
      font-size: 14px;
      color: var(--text-primary);
      margin-bottom: 4px;
      line-height: 1.5;
    }

    .ex-en {
      font-size: 12px;
      color: var(--text-muted);
      line-height: 1.5;
    }

    /* ── No results ─────────────────────────────────────────── */
    .empty {
      grid-column: 1 / -1;
      text-align: center;
      padding: 64px 20px;
    }
    .empty-emoji { font-size: 52px; display: block; margin-bottom: 16px; }
    .empty h3    { font-size: 18px; color: var(--text-secondary); margin-bottom: 8px; }
    .empty p     { font-size: 14px; color: var(--text-muted); }

    /* ── Footer ─────────────────────────────────────────────── */
    footer {
      position: relative;
      z-index: 1;
      text-align: center;
      padding: 48px 20px 36px;
      margin-top: 24px;
      border-top: 1px solid var(--border-subtle);
      color: var(--text-dim);
      font-size: 13px;
      line-height: 2;
    }

    footer strong { color: var(--text-muted); }

    /* ── Animations ─────────────────────────────────────────── */
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(18px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    @keyframes pulseGlow {
      0%, 100% { box-shadow: 0 0 22px rgba(151, 71, 255, 0.15); }
      50%       { box-shadow: 0 0 42px rgba(151, 71, 255, 0.32); }
    }
  </style>
</head>

  <!-- Stan of the Day -->

  <!-- Results -->

    <div class="cards-grid" id="cardsGrid"></div>
  </section>

</main>

<!-- ── FOOTER ─────────────────────────────────────────────── -->

</footer>

      vibe: "Light and cheerful. Can mean 'I like it,' 'sounds good,' or 'sure, let's go' — context does all the heavy lifting. 👍",
      exampleKo: "그 아이디어 진짜 좋아, 바로 해보자.",
      exampleEn: "I really like that idea — let's do it right now."
    },
    {
      id: 65, korean: "싫어", romanization: "si-reo",
      english: "I don't like it / No way", pos: "phrase", category: "daily",
      vibe: "Blunt and unmistakable. In K-pop variety shows, the dramatic '싫어!' is practically its own character arc. 🙅",
      exampleKo: "그건 싫어, 다른 방법 없어?",
      exampleEn: "I don't want that — is there any other way?"
    },
    {
      id: 66, korean: "너무", romanization: "neo-mu",
      english: "So very / Too much (intensifier)", pos: "adverb", category: "daily",
      vibe: "Originally meant 'too much' (negative), now the ultimate enthusiastic intensifier. 너무 좋아! means 'I love it SO much.' 💫",
      exampleKo: "이 노래 너무 좋아서 하루 종일 들었어.",
      exampleEn: "I love this song so much I listened to it all day long."
    },
    {
      id: 67, korean: "완전", romanization: "wan-jeon",
      english: "Completely / Totally (slang)", pos: "adverb", category: "daily",
      vibe: "The turbo boost of emphasis. Slap it in front of anything to make it 100% more intense. 완전 대박! 🔥",
      exampleKo: "그 무대 완전 대박이었어, 눈 못 떼겠더라.",
      exampleEn: "That stage was totally incredible — I literally couldn't look away."
    },
    {
      id: 68, korean: "솔직히", romanization: "sol-jik-i",
      english: "Honestly / To be frank", pos: "adverb", category: "daily",
      vibe: "The word that turns a casual observation into a confession. Signals what follows is the unfiltered truth. 💬",
      exampleKo: "솔직히 말하면, 이 노래 처음엔 별로였는데 지금은 최애야.",
      exampleEn: "Honestly, I didn't like this song at first — but now it's my absolute favorite."
    },
    {
      id: 69, korean: "일단", romanization: "il-dan",
      english: "First / For now / Let me just", pos: "adverb", category: "daily",
      vibe: "Buys thinking time while sounding decisive. The verbal equivalent of 'hold on, let me figure this out.' 🤔",
      exampleKo: "일단 앉아서 얘기하자, 천천히.",
      exampleEn: "Let's just sit down first and talk it through slowly."
    },
    {
      id: 70, korean: "왜", romanization: "wae",
      english: "Why", pos: "interrogative", category: "daily",
      vibe: "One syllable, infinite depth. Can be curious, frustrated, heartbroken, or just dramatically and hilariously confused. ❓",
      exampleKo: "왜 이 노래를 들으면 항상 눈물이 나는 걸까.",
      exampleEn: "Why is it that every time I hear this song, the tears just come?"
    }
  ];

  /* ─────────────── STATE ────────────────────────────────── */
  let currentCat = 'all';
  let query      = '';

  const catEmoji = { lyrics: '💜', fandom: '🔥', vibes: '✨', daily: '💬' };
  const catName  = { lyrics: 'Lyrics', fandom: 'Fandom', vibes: 'Vibes', daily: 'Daily' };

  /* ─────────────── STAN OF THE DAY ─────────────────────── */
  function renderSotd() {
    const idx  = (new Date().getDate() - 1) % words.length;
    const w    = words[idx];
    const date = new Date().toLocaleDateString('en-US', { month: 'short', day: 'numeric' });

    document.getElementById('sotdCard').innerHTML = `
      <div class="sotd-badge">⭐ Stan of the Day · ${date}</div>
      <div class="card-head">
        <div class="card-ko">${w.korean}</div>
        <span class="cat-badge cat-${w.category}">${catEmoji[w.category]} ${catName[w.category]}</span>
      </div>
      <div class="card-roman">${w.romanization}</div>
      <div class="card-en">${w.english}</div>
      <span class="card-pos">${w.pos}</span>
      <div class="card-divider"></div>
      <div class="vibe-label">Vibe Check</div>
      <div class="vibe-text">"${w.vibe}"</div>
      <div class="card-example">
        <div class="ex-ko">${w.exampleKo}</div>
        <div class="ex-en">${w.exampleEn}</div>
      </div>`;
  }

  /* ─────────────── TRENDING ─────────────────────────────── */
  function renderTrending() {
    const picks = [0, 5, 10, 15, 2, 7, 12, 19].map(i => words[i]);
    document.getElementById('trendingChips').innerHTML = picks.map(w => `
      <button class="trend-chip" onclick="triggerSearch('${w.korean}')">
        ${w.korean}<small>${w.english}</small>
      </button>`).join('');
  }

  /* ─────────────── FILTER & RENDER ─────────────────────── */
  function filtered() {
    const q = query.toLowerCase().trim();
    return words.filter(w => {
      const catOk = currentCat === 'all' || w.category === currentCat;
      const qOk   = !q
        || w.korean.includes(q)
        || w.romanization.toLowerCase().includes(q)
        || w.english.toLowerCase().includes(q)
        || w.vibe.toLowerCase().includes(q)
        || w.exampleKo.includes(q)
        || w.exampleEn.toLowerCase().includes(q);
      return catOk && qOk;
    });
  }

  function renderCards() {
    const list = filtered();
    const n    = list.length;

    document.getElementById('resultsCount').innerHTML =
      `Showing <em>${n}</em> word${n !== 1 ? 's' : ''}`;

    document.getElementById('cardsGrid').innerHTML = n === 0
      ? `<div class="empty">
           <span class="empty-emoji">💜</span>
           <h3>No words found</h3>
           <p>Try searching in Korean, English, or romanization.</p>
         </div>`
      : list.map((w, i) => `
        <div class="word-card" style="animation-delay:${i * 0.045}s">
          <div class="card-head">
            <div class="card-ko">${w.korean}</div>
            <span class="cat-badge cat-${w.category}">${catEmoji[w.category]} ${catName[w.category]}</span>
          </div>
          <div class="card-roman">${w.romanization}</div>
          <div class="card-en">${w.english}</div>
          <span class="card-pos">${w.pos}</span>
          <div class="card-divider"></div>
          <div class="vibe-label">Vibe Check</div>
          <div class="vibe-text">"${w.vibe}"</div>
          <div class="card-example">
            <div class="ex-ko">${w.exampleKo}</div>
            <div class="ex-en">${w.exampleEn}</div>
          </div>
        </div>`).join('');
  }

  /* ─────────────── HELPERS ──────────────────────────────── */
  function triggerSearch(term) {
    const input = document.getElementById('searchInput');
    input.value = term;
    query       = term;
    currentCat  = 'all';
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    document.querySelector('[data-cat="all"]').classList.add('active');
    document.getElementById('searchClear').classList.add('show');
    toggleContextSections(true);
    renderCards();
    document.getElementById('resultsSection').scrollIntoView({ behavior: 'smooth', block: 'start' });
  }

  function toggleContextSections(hide) {
    ['sotdSection', 'trendingSection'].forEach(id => {
      document.getElementById(id).style.display = hide ? 'none' : 'block';
    });
  }

  /* ─────────────── EVENTS ───────────────────────────────── */
  document.getElementById('searchInput').addEventListener('input', e => {
    query = e.target.value;
    const hasQ = query.trim().length > 0;
    document.getElementById('searchClear').classList.toggle('show', hasQ);
    toggleContextSections(hasQ);
    renderCards();
  });

  document.getElementById('searchClear').addEventListener('click', () => {
    const input = document.getElementById('searchInput');
    input.value = '';
    query = '';
    document.getElementById('searchClear').classList.remove('show');
    toggleContextSections(false);
    renderCards();
    input.focus();
  });

  document.getElementById('filtersRow').addEventListener('click', e => {
    const btn = e.target.closest('.filter-btn');
    if (!btn) return;
    currentCat = btn.dataset.cat;
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    renderCards();
  });

  /* ─────────────── INIT ─────────────────────────────────── */
  renderSotd();
  renderTrending();
  renderCards();
</script>

</body>
</html>
