const words = [
  {id:1,korean:"사랑",romanization:"sa-rang",english:"Love",pos:"noun",category:"lyrics",vibe:"The word powering at least 90% of all K-pop songs ever recorded. Overused? Never.",exampleKo:"너를 사랑해, 이 마음이 진심이야.",exampleEn:"I love you — this feeling is completely real."},
  {id:2,korean:"그리움",romanization:"geu-ri-um",english:"Longing / Yearning",pos:"noun",category:"lyrics",vibe:"That beautiful, aching feeling when someone is gone but never truly forgotten.",exampleKo:"네가 떠난 후, 그리움만 남았어.",exampleEn:"After you left, only longing remained."},
  {id:3,korean:"설렘",romanization:"seol-lem",english:"Flutter / Excitement",pos:"noun",category:"lyrics",vibe:"The butterflies in your chest — from a crush, a comeback teaser, or honestly both.",exampleKo:"이 노래를 들을 때마다 설렘이 느껴져.",exampleEn:"Every time I hear this song, I feel that flutter."},
  {id:4,korean:"영원",romanization:"yeong-won",english:"Eternity / Forever",pos:"noun",category:"lyrics",vibe:"The solemn promise made in every ballad bridge. Deep, romantic, infinite.",exampleKo:"우리의 인연이 영원하길 바라.",exampleEn:"I hope our bond lasts forever."},
  {id:5,korean:"청춘",romanization:"cheong-chun",english:"Youth",pos:"noun",category:"lyrics",vibe:"Not just being young — it's the burning, golden era that's quietly slipping away.",exampleKo:"이 순간이 우리의 청춘이야, 잊지 마.",exampleEn:"This moment is our youth — don't forget it."},
  {id:6,korean:"최애",romanization:"choe-ae",english:"Ultimate Bias",pos:"noun",category:"fandom",vibe:"Your number one. The one who owns your entire heart without even trying.",exampleKo:"내 최애는 항상 내 기분을 좋게 해줘.",exampleEn:"My ultimate bias always makes me feel better, no matter what."},
  {id:7,korean:"입덕",romanization:"ip-deok",english:"Falling into a fandom",pos:"noun / verb",category:"fandom",vibe:"The point of no return. One video, one performance — and suddenly you're in forever.",exampleKo:"그 뮤직비디오 보고 바로 입덕해버렸어.",exampleEn:"I watched that one video and immediately fell deep into the fandom."},
  {id:8,korean:"덕질",romanization:"deok-jil",english:"Stan activities / Fanning",pos:"noun",category:"fandom",vibe:"The official word for everything you're doing right now. Streaming counts.",exampleKo:"요즘 덕질이 너무 바빠서 잠도 못 자.",exampleEn:"I've been so busy with stan activities I can barely sleep."},
  {id:9,korean:"포카",romanization:"po-ka",english:"Photocard",pos:"noun",category:"fandom",vibe:"Tiny rectangles that technically cost almost nothing but somehow empty your wallet.",exampleKo:"이번 앨범 포카 다 모으려면 얼마나 걸릴까?",exampleEn:"How long will it take to collect all the photocards from this album?"},
  {id:10,korean:"컴백",romanization:"keom-baek",english:"Comeback",pos:"noun",category:"fandom",vibe:"New music + new era + new concept. The moment the fandom comes fully alive.",exampleKo:"컴백 D-day, 온 팬덤이 들썩거렸어.",exampleEn:"On comeback day, the entire fandom was absolutely buzzing."},
  {id:11,korean:"정",romanization:"jeong",english:"Deep emotional bond",pos:"noun",category:"vibes",vibe:"Untranslatable warmth. More than love, deeper than friendship. Built slowly, lost reluctantly.",exampleKo:"오래 볼수록 정이 드는 것 같아.",exampleEn:"The more time we spend together, the more 정 I feel."},
  {id:12,korean:"한",romanization:"han",english:"Deep collective sorrow",pos:"noun",category:"vibes",vibe:"Korea's most complex emotion — grief, longing, and beauty tangled into one feeling.",exampleKo:"이 발라드에는 한국의 한이 담겨 있어.",exampleEn:"This ballad carries Korea's 한 within every single note."},
  {id:13,korean:"애교",romanization:"ae-gyo",english:"Cute / Aegyo",pos:"noun",category:"vibes",vibe:"Acting adorably to win hearts. An art form. A weapon. Use it wisely.",exampleKo:"애교 부리면 다 용서가 돼.",exampleEn:"When they do aegyo, everything is automatically forgiven."},
  {id:14,korean:"눈치",romanization:"nun-chi",english:"Reading the room",pos:"noun",category:"vibes",vibe:"Social awareness taken to an Olympic level. Sensing vibes before a single word is said.",exampleKo:"눈치 빠른 사람은 말 안 해도 다 알아.",exampleEn:"Someone with good 눈치 understands everything without a single word."},
  {id:15,korean:"인연",romanization:"in-yeon",english:"Fated connection",pos:"noun",category:"vibes",vibe:"A bond written before you were born. Used for soulmates — and for finding your bias.",exampleKo:"우리가 만난 건 인연이야, 분명히.",exampleEn:"Our meeting was definitely fated."},
  {id:16,korean:"대박",romanization:"dae-bak",english:"Amazing / Jackpot",pos:"exclamation",category:"daily",vibe:"All-purpose hype word. Means wow, no way, and this is the best thing ever.",exampleKo:"이 노래 진짜 대박이다, 미쳤어!",exampleEn:"This song is seriously amazing — I can't even."},
  {id:17,korean:"화이팅",romanization:"hwa-i-ting",english:"You got this / Fighting",pos:"exclamation",category:"daily",vibe:"Korea's ultimate cheer. Deploy before exams, concerts, and anything terrifying.",exampleKo:"오늘 공연 잘 될 거야, 화이팅!",exampleEn:"Tonight's show will go great — you got this!"},
  {id:18,korean:"진짜",romanization:"jin-jja",english:"Really / Seriously",pos:"adverb",category:"daily",vibe:"The ultimate emphasis amplifier. Stack it twice for maximum effect.",exampleKo:"이거 진짜 맛있어? 진짜 진짜로?",exampleEn:"Is this really that good? Like, really really?"},
  {id:19,korean:"헐",romanization:"heol",english:"OMG / No way",pos:"exclamation",category:"daily",vibe:"Dropped when something is so surprising your brain can't form full words anymore.",exampleKo:"헐, 이게 실화야? 말이 안 돼.",exampleEn:"OMG, is this actually real? I cannot believe it."},
  {id:20,korean:"짱",romanization:"jjang",english:"The absolute best",pos:"adjective / exclamation",category:"daily",vibe:"Peak superlative. When something is so good it sits at the very top of the universe.",exampleKo:"오늘 공연 짱이었어, 역대급!",exampleEn:"Tonight's show was THE BEST — literally of all time."},
  {id:21,korean:"별",romanization:"byeol",english:"Star",pos:"noun",category:"lyrics",vibe:"Celestial and quietly melancholy. The night sky's anchor.",exampleKo:"어두운 밤하늘에 별 하나가 빛났어.",exampleEn:"One star shone bright in the dark night sky."},
  {id:22,korean:"달",romanization:"dal",english:"Moon",pos:"noun",category:"lyrics",vibe:"Soft, distant, and achingly beautiful. The moon watches over you even when no one else does.",exampleKo:"창문 너머로 달이 떠올랐을 때 네 생각이 났어.",exampleEn:"When the moon rose beyond my window, I thought of you."},
  {id:23,korean:"봄날",romanization:"bom-nal",english:"Spring day",pos:"noun",category:"lyrics",vibe:"Warmth returning after endless cold. Hope, reunion, and the gentle end of longing.",exampleKo:"이 긴 겨울이 지나면 봄날이 올 거야.",exampleEn:"When this long winter passes, a spring day will come."},
  {id:24,korean:"운명",romanization:"un-myeong",english:"Fate / Destiny",pos:"noun",category:"lyrics",vibe:"The invisible thread pulling two people together. K-pop leans on it heavily.",exampleKo:"이건 우연이 아니야, 운명이 우리를 이어준 거야.",exampleEn:"This isn't coincidence — fate is what connected us."},
  {id:25,korean:"약속",romanization:"yak-sok",english:"Promise",pos:"noun",category:"lyrics",vibe:"Heavier than it sounds. In K-pop, a promise between an artist and fans is considered sacred.",exampleKo:"꼭 돌아올게, 약속해.",exampleEn:"I'll definitely come back — I promise."},
  {id:26,korean:"기다림",romanization:"gi-da-rim",english:"Waiting / Anticipation",pos:"noun",category:"lyrics",vibe:"The slow ache of counting down to a comeback, a return, or a reunion.",exampleKo:"오랜 기다림 끝에 마침내 만나게 됐어.",exampleEn:"After such a long wait, we finally get to meet."},
  {id:27,korean:"추억",romanization:"chu-eok",english:"Memory / Nostalgia",pos:"noun",category:"lyrics",vibe:"More than just memories — it's the golden warmth you feel looking back at something you loved and lost.",exampleKo:"그 콘서트는 평생 잊지 못할 추억이 됐어.",exampleEn:"That concert became a memory I'll treasure for the rest of my life."},
  {id:28,korean:"빛",romanization:"bit",english:"Light",pos:"noun",category:"lyrics",vibe:"Literal brightness, always carrying metaphor — hope in darkness, someone who lights up your world.",exampleKo:"네가 내 어두운 세상에 빛을 가져다줬어.",exampleEn:"You brought light into my dark world."},
  {id:29,korean:"꽃",romanization:"kkot",english:"Flower",pos:"noun",category:"lyrics",vibe:"Beauty and transience wrapped in a single syllable. Blooms fast, fades fast.",exampleKo:"봄에 핀 꽃처럼 네 미소가 세상을 밝혀.",exampleEn:"Like flowers blooming in spring, your smile lights up the whole world."},
  {id:30,korean:"바다",romanization:"ba-da",english:"Sea / Ocean",pos:"noun",category:"lyrics",vibe:"Vast, endless, and emotionally overwhelming — much like your feelings for your bias at 2am.",exampleKo:"눈을 감으면 끝없는 바다가 보여.",exampleEn:"When I close my eyes, I see an endless sea."},
  {id:31,korean:"하늘",romanization:"ha-neul",english:"Sky",pos:"noun",category:"lyrics",vibe:"Open, free, and always watching. The sky in K-pop lyrics is rarely just weather — it's pure emotion.",exampleKo:"맑은 하늘 아래서 네 이름을 불러봤어.",exampleEn:"Under the clear sky, I called out your name."},
  {id:32,korean:"새벽",romanization:"sae-byeok",english:"Dawn / Before sunrise",pos:"noun",category:"lyrics",vibe:"That liminal 3-5am hour when everything feels fragile and infinite at once.",exampleKo:"새벽에 혼자 이 노래를 들으면 눈물이 나.",exampleEn:"Listening to this song alone at dawn, the tears just come."},
  {id:33,korean:"응원봉",romanization:"eung-won-bong",english:"Lightstick",pos:"noun",category:"fandom",vibe:"More than a glow stick — it's a fandom's identity, a sea of light, and proof you're officially in.",exampleKo:"응원봉을 들고 콘서트장에 들어가면 진짜 느낌이 달라.",exampleEn:"Holding a lightstick as you enter the concert venue just hits differently."},
  {id:34,korean:"콘서트",romanization:"kon-seo-teu",english:"Concert",pos:"noun",category:"fandom",vibe:"The pinnacle of stan life. Months of waiting, seconds of seeing them, memories that last a decade.",exampleKo:"첫 콘서트 티켓 구했을 때 손이 떨렸어.",exampleEn:"When I got my first concert ticket, my hands were literally shaking."},
  {id:35,korean:"팬미팅",romanization:"paen-mi-ting",english:"Fan meeting",pos:"noun",category:"fandom",vibe:"Closer than a concert, more intimate than a dream. The event where you might actually make eye contact.",exampleKo:"팬미팅에서 눈이 마주쳤을 때 심장이 멈추는 줄 알았어.",exampleEn:"When we made eye contact at the fan meeting, I thought my heart had stopped."},
  {id:36,korean:"굿즈",romanization:"gut-jeu",english:"Merchandise / Goods",pos:"noun",category:"fandom",vibe:"Physical proof of your love. Officially bankrupting stans worldwide.",exampleKo:"이번 굿즈 리스트 봤어? 지갑이 울고 있어.",exampleEn:"Did you see the new merch list? My wallet is literally crying."},
  {id:37,korean:"앨범",romanization:"ael-beom",english:"Album",pos:"noun",category:"fandom",vibe:"Not just music — it's a universe, an era, and a reason for chaos at midnight on release day.",exampleKo:"새 앨범 발매일에 바로 들을 수 있게 미리 예약했어.",exampleEn:"I pre-ordered so I could listen the moment the new album drops."},
  {id:38,korean:"뮤비",romanization:"myu-bi",english:"Music Video (MV)",pos:"noun",category:"fandom",vibe:"A visual universe you'll analyze frame by frame for hidden theories at 2am.",exampleKo:"뮤비 처음 봤을 때 너무 충격받아서 다섯 번 연속으로 봤어.",exampleEn:"The first time I watched the MV, I was so shocked I watched it five times in a row."},
  {id:39,korean:"안무",romanization:"an-mu",english:"Choreography",pos:"noun",category:"fandom",vibe:"The language of idols — every finger placement intentional, every formation a conversation.",exampleKo:"이 노래 안무가 너무 세서 보는 것만으로도 지쳐.",exampleEn:"The choreography for this song is so intense it's exhausting just to watch."},
  {id:40,korean:"직캠",romanization:"jik-kaem",english:"Fancam",pos:"noun",category:"fandom",vibe:"One member. One camera. One performance that lives forever on the internet.",exampleKo:"그 무대 직캠 조회수가 하루 만에 백만을 넘었어.",exampleEn:"The fancam from that stage hit a million views in just one day."},
  {id:41,korean:"비주얼",romanization:"bi-ju-eol",english:"Visual (member)",pos:"noun",category:"fandom",vibe:"The member designated most likely to make you forget how to breathe.",exampleKo:"그룹 비주얼이라더니, 진짜 눈부시게 예뻐.",exampleEn:"They said they were the group's visual — honestly, absolutely radiant."},
  {id:42,korean:"데뷔",romanization:"de-byu",english:"Debut",pos:"noun",category:"fandom",vibe:"The first step into an idol's public life. Preceded by years of hard training.",exampleKo:"데뷔 무대 영상 보면 지금이랑 너무 다르다.",exampleEn:"Watching the debut stage video, they look so different from now."},
  {id:43,korean:"센터",romanization:"sen-teo",english:"Center (position)",pos:"noun",category:"fandom",vibe:"Front and middle. The focal point. The one your eyes are always drawn to.",exampleKo:"센터에 서면 카메라가 자연스럽게 따라가.",exampleEn:"When they stand in the center, the cameras naturally follow."},
  {id:44,korean:"막내",romanization:"mak-nae",english:"Youngest member",pos:"noun",category:"fandom",vibe:"Officially the youngest, but somehow the most chaotic energy in the group.",exampleKo:"막내인데 왜 제일 무서운 거야, 진짜.",exampleEn:"They're the youngest, but somehow the most intimidating — for real."},
  {id:45,korean:"우리",romanization:"u-ri",english:"We / Our / Us",pos:"pronoun",category:"vibes",vibe:"In Korean, our is used even for personal things. Warmly collective by nature.",exampleKo:"우리 같이 이 여정을 함께 걸어가자.",exampleEn:"Let's walk this journey together, all of us."},
  {id:46,korean:"흥",romanization:"heung",english:"Groove / Enthusiasm",pos:"noun",category:"vibes",vibe:"The irresistible urge to move when good music plays. Untranslatable joy that starts deep in the chest.",exampleKo:"이 노래 들으면 흥이 절로 나서 가만히 있을 수가 없어.",exampleEn:"When I hear this song, the groove hits instantly — I can't stay still."},
  {id:47,korean:"두근두근",romanization:"du-geun-du-geun",english:"Heart-pounding / Thump-thump",pos:"onomatopoeia",category:"vibes",vibe:"The sound your heart makes when your bias walks in.",exampleKo:"그 사람 보기만 해도 심장이 두근두근거려.",exampleEn:"Just looking at them makes my heart go thump-thump."},
  {id:48,korean:"가슴",romanization:"ga-seum",english:"Heart / Chest",pos:"noun",category:"vibes",vibe:"Used poetically for the emotional heart — where love and longing coexist at full volume.",exampleKo:"이 노래를 들으면 가슴이 먹먹해져.",exampleEn:"Listening to this song makes my chest feel heavy with emotion."},
  {id:49,korean:"마음",romanization:"ma-eum",english:"Heart / Mind / Feelings",pos:"noun",category:"vibes",vibe:"The emotional core of a person — where sincerity lives.",exampleKo:"마음을 담아 쓴 편지야, 읽어줘.",exampleEn:"This is a letter written with my whole heart — please read it."},
  {id:50,korean:"진심",romanization:"jin-sim",english:"Sincerity / Real feelings",pos:"noun",category:"vibes",vibe:"No performance, no filter. When someone says 진심이야, they mean every single word.",exampleKo:"이건 장난이 아니야, 진심이야.",exampleEn:"I'm not joking around — this is completely sincere."},
  {id:51,korean:"인사",romanization:"in-sa",english:"Greeting / Bow",pos:"noun",category:"vibes",vibe:"More than hello — it's respect made physical.",exampleKo:"무대 끝나고 깊은 인사를 할 때 늘 감동받아.",exampleEn:"I'm always moved when they bow deeply at the end of a performance."},
  {id:52,korean:"오빠",romanization:"op-pa",english:"Older brother / Admired older guy",pos:"noun",category:"vibes",vibe:"Used by women toward older males. In K-pop, the word that launched a thousand parasocial feelings.",exampleKo:"오빠 목소리 들으면 왜 이렇게 마음이 편해지는 건지.",exampleEn:"Why is it that hearing his voice just makes everything feel calm?"},
  {id:53,korean:"언니",romanization:"eon-ni",english:"Older sister / Admired older woman",pos:"noun",category:"vibes",vibe:"Used by women toward older females. Overflowing with warmth and admiration.",exampleKo:"저 분 완전 언니 스타일이야, 너무 멋있어.",exampleEn:"She's such an 언니 vibe — seriously so cool."},
  {id:54,korean:"가족",romanization:"ga-jok",english:"Family",pos:"noun",category:"vibes",vibe:"Blood or chosen. In fan culture, fandom members often call each other 가족 — and mean it.",exampleKo:"이 팬덤은 진짜 가족 같은 느낌이야.",exampleEn:"This fandom genuinely feels like family."},
  {id:55,korean:"친구",romanization:"chin-gu",english:"Friend",pos:"noun",category:"vibes",vibe:"Simple word, profound meaning. 친구 who's been there through every single era.",exampleKo:"오랜 친구처럼 편하게 얘기할 수 있어서 좋아.",exampleEn:"It's nice to be able to talk like we're old friends."},
  {id:56,korean:"어른",romanization:"eo-reun",english:"Adult / Grown-up",pos:"noun",category:"vibes",vibe:"A marker of maturity — often used with a hint of we're getting older, aren't we.",exampleKo:"이제 어른이 됐는데도 이 노래 들으면 어릴 때 생각나.",exampleEn:"Even now that I'm an adult, this song takes me right back to childhood."},
  {id:57,korean:"사랑해",romanization:"sa-rang-hae",english:"I love you",pos:"phrase",category:"daily",vibe:"Three syllables carrying the weight of the universe.",exampleKo:"사랑해, 진심으로, 말이 부족할 정도로.",exampleEn:"I love you — sincerely, more than words can say."},
  {id:58,korean:"고마워",romanization:"go-ma-wo",english:"Thank you (casual)",pos:"phrase",category:"daily",vibe:"Warm, casual, and genuine. The everyday version of gratitude.",exampleKo:"항상 내 곁에 있어줘서 고마워.",exampleEn:"Thank you for always being by my side."},
  {id:59,korean:"미안해",romanization:"mi-an-hae",english:"I'm sorry (casual)",pos:"phrase",category:"daily",vibe:"Heartfelt apology between people who know each other well.",exampleKo:"내가 너한테 상처 줬다면 진짜 미안해.",exampleEn:"If I hurt you, I'm truly sorry."},
  {id:60,korean:"괜찮아",romanization:"gwaen-cha-na",english:"It's okay / I'm fine",pos:"phrase",category:"daily",vibe:"The Swiss army knife of Korean reassurance.",exampleKo:"걱정하지 마, 나 괜찮아, 진짜로.",exampleEn:"Don't worry about me — I'm okay, I really am."},
  {id:61,korean:"안녕",romanization:"an-nyeong",english:"Hello / Goodbye",pos:"greeting",category:"daily",vibe:"Does double duty as both greeting and farewell. Simple, warm, never loses its charm.",exampleKo:"안녕, 오늘도 좋은 하루 보내.",exampleEn:"Hi — have a good day today too."},
  {id:62,korean:"잘가",romanization:"jal-ga",english:"Take care / Bye (informal)",pos:"phrase",category:"daily",vibe:"A warm send-off between friends. Literally go well.",exampleKo:"다음에 또 보자, 잘가!",exampleEn:"See you next time — take care!"},
  {id:63,korean:"잘자",romanization:"jal-ja",english:"Good night / Sleep well",pos:"phrase",category:"daily",vibe:"The last words before dreamland.",exampleKo:"오늘도 수고했어, 잘자.",exampleEn:"You worked hard today — sleep well."},
  {id:64,korean:"좋아",romanization:"jo-a",english:"I like it / Good / Sure",pos:"phrase",category:"daily",vibe:"Light and cheerful. Can mean I like it, sounds good, or sure let's go.",exampleKo:"그 아이디어 진짜 좋아, 바로 해보자.",exampleEn:"I really like that idea — let's do it right now."},
  {id:65,korean:"싫어",romanization:"si-reo",english:"I don't like it / No way",pos:"phrase",category:"daily",vibe:"Blunt and unmistakable. The dramatic 싫어! is practically its own character arc.",exampleKo:"그건 싫어, 다른 방법 없어?",exampleEn:"I don't want that — is there any other way?"},
  {id:66,korean:"너무",romanization:"neo-mu",english:"So very / Too much (intensifier)",pos:"adverb",category:"daily",vibe:"The ultimate enthusiastic intensifier. 너무 좋아 means I love it SO much.",exampleKo:"이 노래 너무 좋아서 하루 종일 들었어.",exampleEn:"I love this song so much I listened to it all day long."},
  {id:67,korean:"완전",romanization:"wan-jeon",english:"Completely / Totally (slang)",pos:"adverb",category:"daily",vibe:"The turbo boost of emphasis. Slap it in front of anything to make it 100% more intense.",exampleKo:"그 무대 완전 대박이었어, 눈 못 떼겠더라.",exampleEn:"That stage was totally incredible — I literally couldn't look away."},
  {id:68,korean:"솔직히",romanization:"sol-jik-i",english:"Honestly / To be frank",pos:"adverb",category:"daily",vibe:"The word that turns a casual observation into a confession.",exampleKo:"솔직히 말하면, 이 노래 처음엔 별로였는데 지금은 최애야.",exampleEn:"Honestly, I didn't like this song at first — but now it's my absolute favorite."},
  {id:69,korean:"일단",romanization:"il-dan",english:"First / For now / Let me just",pos:"adverb",category:"daily",vibe:"Buys thinking time while sounding decisive.",exampleKo:"일단 앉아서 얘기하자, 천천히.",exampleEn:"Let's just sit down first and talk it through slowly."},
  {id:70,korean:"왜",romanization:"wae",english:"Why",pos:"interrogative",category:"daily",vibe:"One syllable, infinite depth. Can be curious, frustrated, heartbroken, or just confused.",exampleKo:"왜 이 노래를 들으면 항상 눈물이 나는 걸까.",exampleEn:"Why is it that every time I hear this song, the tears just come?"},
  {id:71,korean:"너",romanization:"neo",english:"You",pos:"pronoun",category:"lyrics",vibe:"The most loaded single syllable in K-pop. Every song's protagonist, every lyric's final destination.",exampleKo:"온 세상이 흔들려도 내 눈엔 너밖에 안 보여.",exampleEn:"Even as the whole world shakes, all I can see is you."},
  {id:72,korean:"너의",romanization:"neo-ui",english:"Your / Of you",pos:"determiner",category:"lyrics",vibe:"More intimate than your in English — 너의 lingers.",exampleKo:"너의 목소리가 내 하루를 가득 채워줘.",exampleEn:"Your voice fills my entire day."},
  {id:73,korean:"노을",romanization:"no-eul",english:"Sunset glow / Evening sky",pos:"noun",category:"lyrics",vibe:"That golden-orange blur right before night falls. Bittersweet, brief, and impossibly cinematic.",exampleKo:"저녁 노을처럼 아름다운 순간이었어.",exampleEn:"It was a moment as beautiful as the evening glow."},
  {id:74,korean:"영혼",romanization:"yeong-hon",english:"Soul / Spirit",pos:"noun",category:"lyrics",vibe:"The deepest layer of a person. Used for performers who give not just their skill, but everything underneath.",exampleKo:"이 무대에 영혼까지 담아서 불렀어.",exampleEn:"They poured their very soul into that performance."},
  {id:75,korean:"떠나다",romanization:"tteo-na-da",english:"To leave / To depart",pos:"verb",category:"lyrics",vibe:"The departure that haunts every ballad outro. It's never just leaving.",exampleKo:"네가 떠난 자리에 아직도 네 향기가 남아 있어.",exampleEn:"Where you once stood, your scent still lingers."},
  {id:76,korean:"잊다",romanization:"it-da",english:"To forget",pos:"verb",category:"lyrics",vibe:"The act that's impossible yet constantly promised in sad songs. Spoiler: they never actually forget.",exampleKo:"잊으려 할수록 더 선명하게 떠올라.",exampleEn:"The more I try to forget, the more clearly you appear."},

  {id:108,korean:"우정",romanization:"u-jeong",english:"Friendship",pos:"noun",category:"vibes",vibe:"The bond forged through shared music, late concert nights, and mutual understanding.",exampleKo:"이 팬덤 안에서 진짜 우정을 찾았어.",exampleEn:"I found real, lasting friendship inside this fandom."},
  {id:109,korean:"감동",romanization:"gam-dong",english:"Being deeply moved / Touched",pos:"noun",category:"vibes",vibe:"That wave hitting your chest when a performance transcends skill.",exampleKo:"무대 끝나고 감동받아서 한동안 말을 못 했어.",exampleEn:"After the show ended I was so moved I couldn't speak for a while."},
  {id:110,korean:"인생",romanization:"in-saeng",english:"Life / One's life journey",pos:"noun",category:"vibes",vibe:"인생 앨범, 인생 무대, 인생 곡 — the one that defines everything.",exampleKo:"이 앨범은 진짜 내 인생 앨범이야, 완전히 바꿔놨어.",exampleEn:"This album is genuinely my life album — it completely changed everything."},
  {id:111,korean:"외로움",romanization:"oe-ro-um",english:"Loneliness / Solitude",pos:"noun",category:"vibes",vibe:"The honest emotion K-pop ballads fully embrace. Vulnerability worn with quiet elegance.",exampleKo:"이 노래 들으면 내 외로움이 위로받는 느낌이야.",exampleEn:"Listening to this song, I feel like my loneliness is somehow being consoled."},
  {id:112,korean:"따뜻하다",romanization:"tta-tteu-ta-da",english:"To be warm / Heartwarming",pos:"adjective",category:"vibes",vibe:"Physical warmth extended into emotion. The word for when a voice gently holds you.",exampleKo:"그 목소리를 들으면 따뜻하다는 느낌이 들어.",exampleEn:"Hearing that voice, I feel a warmth I can't quite explain."},
  {id:113,korean:"기억",romanization:"gi-eok",english:"Memory / Recollection",pos:"noun",category:"vibes",vibe:"The sharp clarity of something you can't and won't let fade away.",exampleKo:"그 날의 기억이 아직도 선명하게 남아 있어.",exampleEn:"The memory of that day still remains vivid and utterly clear."},
  {id:114,korean:"어머",romanization:"eo-meo",english:"Oh my / My goodness",pos:"exclamation",category:"daily",vibe:"A gasp dressed as a word. The sound of someone who just saw something unbelievable.",exampleKo:"어머, 이거 진짜야? 말이 안 나와.",exampleEn:"Oh my, is this real? I'm completely speechless."},

  {id:118,korean:"너무너무",romanization:"neo-mu-neo-mu",english:"So so much / Way too much",pos:"adverb",category:"daily",vibe:"너무 doubled for when once simply isn't enough.",exampleKo:"이 노래 너무너무 좋아서 오늘만 스무 번 들었어.",exampleEn:"I love this song so so much I listened to it twenty times today."},

];

const catEmoji={lyrics:'💜',fandom:'🔥',vibes:'✨',daily:'💬'};
const catName={lyrics:'Lyrics',fandom:'Fandom',vibes:'Vibes',daily:'Daily'};
let currentCat='all',query='';

function renderSotd(){
  const idx=(new Date().getDate()-1)%words.length;
  const w=words[idx];
  const date=new Date().toLocaleDateString('en-US',{month:'short',day:'numeric'});
  document.getElementById('sotdSection').innerHTML=`
    <div class="sotd-banner">
      <div class="sotd-inner" onclick="openDetail(${w.id})">
        <div class="sotd-tag">⭐ Stan of the Day · ${date}</div>
        <div class="sotd-ko">${w.korean}</div>
        <div class="sotd-roman">${w.romanization}</div>
        <div class="sotd-en">${w.english}</div>
        <div class="sotd-vibe">"${w.vibe}"</div>
        <div class="sotd-tap-hint">Tap to read more →</div>
      </div>
    </div>`;
}

function filtered(){
  const q=query.toLowerCase().trim();
  return words.filter(w=>{
    const catOk=currentCat==='all'||w.category===currentCat;
    const qOk=!q||w.korean.includes(q)||w.romanization.toLowerCase().includes(q)||w.english.toLowerCase().includes(q)||w.vibe.toLowerCase().includes(q);
    return catOk&&qOk;
  });
}

function renderFeed(){
  const list=filtered();
  const n=list.length;
  const hasSearch=query.trim().length>0;
  document.getElementById('sotdSection').style.display=hasSearch?'none':'block';
  document.getElementById('feedLabel').textContent=hasSearch?'Search Results':'All Words';
  document.getElementById('resultsCount').innerHTML=`<em>${n}</em> word${n!==1?'s':''}`;
  if(n===0){
    document.getElementById('cardsContainer').innerHTML='<div class="empty"><span>💜</span><h3>No words found</h3><p>Try Korean, English, or romanization.</p></div>';
    return;
  }
  document.getElementById('cardsContainer').innerHTML=list.map((w,i)=>`
    <div class="feed-card" style="animation-delay:${i*0.04}s" onclick="openDetail(${w.id})">
      <div class="card-top">
        <div class="card-ko">${w.korean}</div>
        <span class="cat-badge cat-${w.category}">${catEmoji[w.category]} ${catName[w.category]}</span>
      </div>
      <div class="card-body">
        <div class="card-roman">${w.romanization}</div>
        <div class="card-en">${w.english}</div>
        <span class="card-pos">${w.pos}</span>
        <div class="card-divider"></div>
        <div class="vibe-label">Vibe Check</div>
        <div class="vibe-text">"${w.vibe}"</div>
        <div class="card-tap-hint">💜 Tap for full story</div>
      </div>
    </div>`).join('');
}

function openDetail(id){
  const w=words.find(x=>x.id===id);
  if(!w)return;
  document.getElementById('detailCatBadge').innerHTML=`<span class="cat-badge cat-${w.category}">${catEmoji[w.category]} ${catName[w.category]}</span>`;
  document.getElementById('detailBody').innerHTML=`
    <div class="detail-ko">${w.korean}</div>
    <div class="detail-roman">${w.romanization}</div>
    <div class="detail-en">${w.english}</div>
    <span class="detail-pos">${w.pos}</span>
    <div class="detail-section-label">Vibe Check</div>
    <div class="detail-vibe">"${w.vibe}"</div>
    ${w.exampleKo?`<div class="detail-section-label">Example</div><div class="detail-example"><div class="detail-ex-ko">${w.exampleKo}</div><div class="detail-ex-en">${w.exampleEn}</div></div>`:''}`;
  document.getElementById('cardDetail').classList.add('open');
  document.body.style.overflow='hidden';
}

function closeDetail(){
  document.getElementById('cardDetail').classList.remove('open');
  document.body.style.overflow='';
}

document.getElementById('searchInput').addEventListener('input',e=>{
  query=e.target.value;
  document.getElementById('searchClear').classList.toggle('show',query.trim().length>0);
  renderFeed();
});
document.getElementById('searchClear').addEventListener('click',()=>{
  document.getElementById('searchInput').value='';
  query='';
  document.getElementById('searchClear').classList.remove('show');
  renderFeed();
});
document.getElementById('filtersRow').addEventListener('click',e=>{
  const btn=e.target.closest('.filter-btn');
  if(!btn)return;
  currentCat=btn.dataset.cat;
  document.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  renderFeed();
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){
    if(document.getElementById('cardDetail').classList.contains('open'))closeDetail();
    else if(document.getElementById('suggestBackdrop').classList.contains('open'))closeSuggestModal();
  }
});

function openSuggestModal(){
  document.getElementById('suggestBackdrop').classList.add('open');
  document.body.style.overflow='hidden';
}
function closeSuggestModal(e){
  if(e&&e.target!==e.currentTarget)return;
  document.getElementById('suggestBackdrop').classList.remove('open');
  document.body.style.overflow='';
  setTimeout(()=>{
    document.getElementById('suggestFormWrap').style.display='';
    document.getElementById('formSuccess').style.display='none';
    document.getElementById('suggestForm').reset();
    const btn=document.getElementById('submitBtn');
    btn.disabled=false;btn.textContent='제안 보내기 💜';
    document.getElementById('formError').style.display='none';
  },280);
}

document.getElementById('suggestForm').addEventListener('submit',async e=>{
  e.preventDefault();
  const form=e.target;
  const btn=document.getElementById('submitBtn');
  const errMsg=document.getElementById('formError');
  const korean=form['한국어 단어'].value.trim();
  const english=form['영어 뜻'].value.trim();
  if(!korean||!english){errMsg.textContent='한국어 단어와 영어 뜻은 필수 항목이에요.';errMsg.style.display='block';return;}
  btn.disabled=true;btn.textContent='전송 중...';errMsg.style.display='none';
  const payload={'한국어 단어':korean,'로마자 발음':form['로마자 발음'].value.trim(),'영어 뜻':english,'카테고리':form['카테고리'].value,'Vibe Check':form['Vibe Check'].value.trim(),'예문 한국어':form['예문 한국어'].value.trim(),'예문 영어':form['예문 영어'].value.trim()};
  try{
    const res=await fetch('https://formspree.io/f/xkoezopy',{method:'POST',headers:{'Content-Type':'application/json','Accept':'application/json'},body:JSON.stringify(payload)});
    if(!res.ok)throw new Error('server');
    document.getElementById('suggestFormWrap').style.display='none';
    document.getElementById('formSuccess').style.display='block';
  }catch{
    errMsg.textContent='제출 중 오류가 발생했어요. 잠시 후 다시 시도해주세요.';
    errMsg.style.display='block';
    btn.disabled=false;btn.textContent='제안 보내기 💜';
  }
});

renderSotd();
renderFeed();

</script>
<script>
if('serviceWorker' in navigator){
  window.addEventListener('load',()=>{navigator.serviceWorker.register('./sw.js').catch(()=>{});});
}
</script>
</body>
</html>
